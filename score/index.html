<!doctype html><meta charset="utf-8"><title>Mashtots Landing · live score v2 (explore)</title>
<link rel="icon" href="data:,">
<!-- The score of make_music.py, synthesised live in WebAudio from its own tables, following any timeline. v2 adds what the first live score left out (tour styles,
     composed duduk, saw stabs, risers, graph-act sonification) and a stem mix balanced by BS.1770 loudness. This page plays it and MEASURES it: calibration (stem
     weights, level plan) and a comparison with the approved mp3 on the approved timeline. Nothing here has been listened to by the builder. -->
<style>
body{margin:0;padding:1.2em 1.6em;background:#0b0a0a;color:#b9b3ad;font:15px/1.5 Georgia,serif}
h1{font-weight:400;color:#e8b86a;font-size:20px;margin:0 0 .4em}
button,select{cursor:pointer;color:#cd9646;background:#141212;border:1px solid rgba(205,150,70,.5);padding:.3em .7em;font:14px Georgia,serif;margin:.15em}
button:focus-visible,select:focus-visible{outline:2px solid #f0cd96}
label{margin-right:1em;white-space:nowrap}
#secs button .hy{color:#e8b86a;margin-right:.4em}
pre{white-space:pre-wrap;color:#d8d2cc;font:13px/1.45 ui-monospace,Menlo,monospace;background:#141212;padding:.8em;border:1px solid #2c2723;max-width:90em}
.note{color:#7d7a78;font-size:13px;max-width:70em}
</style>
<h1>Լսել · the live score, v2</h1>
<div class="note">make_music.py's score in the browser. Layers can be switched off to hear (or measure) what each adds. <b>Not listened to by the builder</b>: the numbers below are measurements, not a verdict.</div>
<p><label>timeline <select id="tl"></select></label> <label>seed <select id="seed"><option>0</option><option>1</option><option>2</option></select></label>
<label><input type="checkbox" id="L_styles" checked> tour styles</label><label><input type="checkbox" id="L_composed" checked> composed duduk</label><label><input type="checkbox" id="L_saws" checked> saws</label><label><input type="checkbox" id="L_fx" checked> risers</label><label><input type="checkbox" id="L_sonif" checked> graph sonification</label><label><input type="checkbox" id="L_measured" checked> measured acts</label><label><input type="checkbox" id="L_mix" checked> stem mix</label>
<button id="stop">stop</button> <button id="measure">measure a whole loop offline</button> <button id="calib">calibrate this timeline, then download score_mix.json</button></p>
<div id="secs"></div>
<pre id="out">loading…</pre>
<script type="module">
import { Timeline, buildScore, Voices, Player, renderOffline, STEMS, stemOf } from "./score.js";
import * as V1 from "../explore/live-score/score.js";
import * as LD from "./loudness.js";
const $ = id => document.getElementById(id), out = $("out"), SR = 32000;
const [data, TL, SEC, data1] = await Promise.all(["score_data.json", "../explore/retime/timelines.json", "../sections.json", "../explore/live-score/score_data.json"].map(u => fetch(u).then(r => r.json())));
let MIX = null; try { MIX = await (await fetch("score_mix.json", { cache: "no-store" })).json(); } catch (_) {}
for (const k of Object.keys(TL)) $("tl").append(new Option(`${k} (${TL[k].cycle.toFixed(1)} s)`, k));
const layers = () => Object.fromEntries(["styles", "composed", "saws", "fx", "sonif", "measured"].map(k => [k, $("L_" + k).checked]));
const mk = (name, seed = 0, opts = {}) => { const tl = new Timeline(TL[name].segs, TL[name].cycle); return { tl, score: buildScore(data, tl, seed, opts) }; };
const mixFor = name => MIX && $("L_mix").checked && MIX.mixes && MIX.mixes[name] ? { ...MIX.mixes[name], norm: MIX.norm } : null;
const tally = score => { const v = {}, k = {}; for (const e of score.events) v[e.v] = (v[e.v] || 0) + 1; for (const n of score.log) k[n.kind] = (k[n.kind] || 0) + 1; return { voices: v, kinds: k }; };

// ---------------------------------------------------------------- calibration (offline, in this browser; the result is baked into score_mix.json)
async function calibrateNorm() {                    // peak of every synthesised voice at amp 1, so that each is "normalised to a peak of 1" the way make_music's samples are
  const cases = { kick: [{ v: "kick" }], hat: [{ v: "hat" }], ohat: [{ v: "ohat" }], clap: [{ v: "clap" }], tek: [{ v: "tek" }], dum: [{ v: "dum" }], bass: [{ v: "bass", f: 55, dur: 0.35 }, { v: "bass", f: 98, dur: 0.35 }],
    pad: [{ v: "pad", f: 293.7, dur: 3 }], duduk: [293.7, 440.5, 587.3].map(f => ({ v: "duduk", f, dur: 2, vib: 1 })), saw: [{ v: "saw", f: 293.7, dur: 0.26, cutoff: 2300 }, { v: "saw", f: 440, dur: 1.5, cutoff: 1500, att: 0.3, rel: 0.6 }],
    riser: [{ v: "riser", dur: 3 }], roll: [{ v: "roll", dur: 2, s16: 0.1171875 }], impact: [{ v: "impact", dur: 2.6 }], cluster: [{ v: "cluster", f: 293.7, dur: 3 }], fourier: [{ v: "fourier", f: 146.8, dur: 4, hs: [1, 2, 3, 4, 6, 8, 12, 16], mags: [1, .8, .6, .5, .4, .3, .2, .1], phs: [0, 1, 2, 3, 4, 5, 6, 0.5] }] };
  const norm = {}, peaks = {};
  for (const [v, list] of Object.entries(cases)) { const ps = []; for (const c of list) { const dur = c.dur || 0.5, ev = { t: 0.1, amp: 1, pan: 0, send: 0, ...c }, stem = stemOf(ev);
    const r = await renderOffline({ events: [ev], droneSub: () => 1 }, 0, dur + 1.5, SR, { cal: true, stems: new Set([stem]) }); ps.push(LD.peakLin(LD.chans(r.buffer)) / Math.SQRT1_2); }
    const m = ps.reduce((a, b) => a + b, 0) / ps.length; peaks[v] = +m.toFixed(4); norm[v] = +(1 / m).toFixed(4); }
  return { norm, peaks };
}
async function calibrate(name, seed = 0, log = () => {}) {
  const { tl, score } = mk(name, seed), t0 = performance.now(), norm = (MIX && MIX.norm) || (await calibrateNorm()).norm, n = Math.round(tl.cycle * SR);
  const w = {}, raw = {};
  for (const nm of STEMS) { const r = await renderOffline(score, 0, tl.cycle, SR, { cal: true, stems: new Set([nm]), norm }), lu = LD.integratedLufs(LD.chans(r.buffer).map(c => c.subarray(0, n)), SR);
    raw[nm] = +lu.toFixed(2); w[nm] = lu > -69 ? +(10 ** ((data.TARGET[nm] - lu) / 20)).toFixed(5) : 0; log(`stem ${nm}: ${lu.toFixed(1)} LUFS -> weight ${w[nm]}`); }
  const xs = score.plan.map(q => q.t), ys = score.plan.map(q => q.lufs), want = t => LD.interp1(t, xs, ys);
  let ride = new Array(Math.ceil(tl.cycle / 0.5) + 3).fill(0), master = 1;
  const measureMix = async () => { const r = await renderOffline(score, 0, tl.cycle, SR, { mix: { w, master, ride, norm }, data, norm }), chs = LD.chans(r.buffer).map(c => c.subarray(0, n)); return { chs, st: LD.shortTerm(chs, SR, 3, 0.5), il: LD.integratedLufs(chs, SR) }; };
  for (const maxdb of [4, 2]) { const m = await measureMix(), g = LD.uniform(m.st.l.map((l, i) => Math.max(-maxdb, Math.min(maxdb, want(m.st.t[i]) - l))), 6); ride = ride.map((r, i) => r + LD.interp1(i * 0.5, m.st.t, g)); log(`ride pass (+-${maxdb} dB): integrated was ${m.il.toFixed(2)} LUFS`); }
  for (let k = 0; k < 2; k++) { const m = await measureMix(); master *= 10 ** ((-17 - m.il) / 20); log(`master gain pass ${k + 1}: integrated ${m.il.toFixed(2)} -> x${master.toFixed(4)}`); }
  const fin = await measureMix(), dev = fin.st.l.map((l, i) => l - want(fin.st.t[i])), rmsDev = Math.sqrt(dev.reduce((s, x) => s + x * x, 0) / dev.length);
  return { w, raw, master: +master.toFixed(5), ride: ride.map(x => +x.toFixed(2)), measured: { integrated: +fin.il.toFixed(2), peakDb: +LD.peakDb(fin.chs).toFixed(2), rmsDeviationFromPlanDb: +rmsDev.toFixed(2), seconds: +((performance.now() - t0) / 1000).toFixed(0) } };
}

// ---------------------------------------------------------------- measurement: loudness, balance and shape against the approved mp3 (approved timeline only)
let MP3 = null;
async function mp3() { if (!MP3) { const ac = new OfflineAudioContext(2, 1, SR), b = await ac.decodeAudioData(await (await fetch("../landing_score.mp3")).arrayBuffer()); MP3 = LD.chans(b); } return MP3; }
async function measure(name, o = {}) {
  const seed = o.seed || 0, { tl, score } = mk(name, seed, o.opts || {}), n = Math.round(tl.cycle * SR); let r, sc = score, ev;
  if (o.v1) { const t1 = new V1.Timeline(TL[name].segs, TL[name].cycle); sc = V1.buildScore(data1, t1, seed); r = await V1.renderOffline(sc, 0, t1.cycle, SR); }
  else { const mix = o.mix === undefined ? mixFor(name) : o.mix; r = await renderOffline(score, 0, tl.cycle, SR, { mix, data, norm: mix && mix.norm }); }
  const chs = LD.chans(r.buffer).map(c => c.subarray(0, n)), res = { timeline: name, seed, v1: !!o.v1, events: sc.events.length, audit: `${sc.audit.checked} checked, ${sc.audit.outside} outside`, integratedLufs: +LD.integratedLufs(chs, SR).toFixed(2), peakDb: +LD.peakDb(chs).toFixed(2), renderS: +((r.prepMs + r.renderMs) / 1000).toFixed(1), x_realtime: +(r.seconds / ((r.prepMs + r.renderMs) / 1000)).toFixed(1) };
  if (name === "approved") {
    const ref = await mp3(), a = LD.shortTerm(chs, SR, 3, 1).l, b = LD.shortTerm(ref.map(c => c.subarray(0, n)), SR, 3, 1).l, k = Math.min(a.length, b.length);
    res.vsMp3 = { shortTermLufsPearson: +LD.pearson(a, b).toFixed(3), meanLufsLive: +(a.reduce((s, x) => s + x, 0) / k).toFixed(2), meanLufsMp3: +(b.reduce((s, x) => s + x, 0) / k).toFixed(2), meanAbsDiffAfterOffsetDb: 0, sections: [] };
    const off = res.vsMp3.meanLufsLive - res.vsMp3.meanLufsMp3; let sad = 0; for (let i = 0; i < k; i++) sad += Math.abs(a[i] - b[i] - off); res.vsMp3.meanAbsDiffAfterOffsetDb = +(sad / k).toFixed(2);
    for (let i = 0; i < SEC.sections.length; i++) { const s0 = SEC.sections[i].t, s1 = i + 1 < SEC.sections.length ? SEC.sections[i + 1].t : tl.cycle, i0 = Math.floor(s0), i1 = Math.min(k, Math.floor(s1)), m = x => x.slice(i0, i1).reduce((s, v) => s + v, 0) / Math.max(1, i1 - i0);
      const sl = LD.spectrum(chs, SR, s0, s1), sm = LD.spectrum(ref, SR, s0, s1); res.vsMp3.sections.push({ id: SEC.sections[i].id, dLufs: +(m(a) - m(b) - off).toFixed(1), centroidLive: Math.round(sl.centroid), centroidMp3: Math.round(sm.centroid), bandsLive: sl.bands.map(x => +x.toFixed(1)), bandsMp3: sm.bands.map(x => +x.toFixed(1)) }); }
  }
  return res;
}

// ---------------------------------------------------------------- the page
let ctx = null, player = null, score = null, tl = null;
const FIRST = { stone: "flight", helix: "lift", tour: "tour", writing: "write", prayer: "prayer", numbers: "numerals", embedding: "space", graph: "web", pretraining: "finale", return: "line2" };
function rebuild() {
  ({ tl, score } = mk($("tl").value, +$("seed").value, layers()));
  const t = tally(score), mx = mixFor($("tl").value);
  out.textContent = `timeline ${$("tl").value}: loop ${tl.cycle.toFixed(2)} s · ${score.events.length} events · groove from bar ${score.groove.startBar} (build ${score.groove.buildBars} bars, gates x${score.groove.stretch.toFixed(2)}) · stem mix ${mx ? "calibrated (" + MIX.about + ")" : MIX ? "off or not calibrated for this timeline" : "not calibrated yet"}\n` +
    `harmony audit (make_music's rules): ${score.audit.checked} pitched notes, ${score.audit.outside} outside the table${score.audit.bad.length ? "\n  " + score.audit.bad.join("\n  ") : ""}\n` +
    `events by voice: ${Object.entries(t.voices).map(([k, v]) => k + " " + v).join(", ")}\nnotes by kind: ${Object.entries(t.kinds).map(([k, v]) => k + " " + v).join(", ")}`;
  $("secs").replaceChildren(...SEC.sections.map(s => { const b = document.createElement("button"), sp = tl.span(FIRST[s.id]); const hy = document.createElement("span"); hy.className = "hy"; hy.textContent = s.hy; b.append(hy, s.en); b.onclick = () => play(sp ? sp[0] : 0); return b; }));
}
async function play(t) {
  if (!ctx) ctx = new AudioContext(); await ctx.resume();
  if (player) player.stop(); const mx = mixFor($("tl").value); player = new Player(ctx, score, new Voices(ctx, ctx.destination, { mix: mx, data, norm: mx && mx.norm })); player.start(t, 1);
  out.textContent = out.textContent.split("\n▶")[0] + `\n▶ playing from ${t.toFixed(2)} s (${ctx.sampleRate} Hz, base latency ${(ctx.baseLatency * 1000).toFixed(1)} ms)`;
}
for (const id of ["tl", "seed", "L_styles", "L_composed", "L_saws", "L_fx", "L_sonif", "L_measured", "L_mix"]) $(id).onchange = () => { if (player) player.stop(); rebuild(); };
$("stop").onclick = () => player && player.stop();
$("measure").onclick = async () => { if (player) player.stop(); out.textContent += "\n… rendering offline"; const m = await measure($("tl").value, { seed: +$("seed").value, opts: layers() }); out.textContent += "\n" + JSON.stringify(m, null, 1); };
$("calib").onclick = async () => {                        // stem weights, level ride and master gain for the chosen timeline; merges into the loaded score_mix.json and offers the file for download
  if (player) player.stop(); const name = $("tl").value, lines = [], show = () => { out.textContent = `calibrating ${name} (about two minutes) …\n` + lines.join("\n"); };
  const norm = (MIX && MIX.norm) || (await calibrateNorm()).norm; MIX = MIX || { about: "", norm, mixes: {} }; MIX.norm = norm; MIX.about = "stem weights, level ride and master gain per timeline, calibrated offline in Chromium at 32 kHz by score/index.html (BS.1770 stems against make_music's targets; ride follows make_music's level plan; integrated -17 LUFS)";
  const c = await calibrate(name, 0, l => { lines.push(l); show(); }); MIX.mixes = MIX.mixes || {}; MIX.mixes[name] = { w: c.w, master: c.master, ride: c.ride, raw: c.raw, measured: c.measured };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(MIX)], { type: "application/json" })); a.download = "score_mix.json"; document.body.append(a); a.click(); a.remove(); rebuild();
  out.textContent += "\nfinal: " + JSON.stringify(c.measured) + "\nsave the downloaded file over score/score_mix.json";
};
Object.assign(window, { calibrate, calibrateNorm, measure, mk, tally, LD, V1, data, TL, SEC, setMix: m => { MIX = m; rebuild(); } });
window.READY = true; rebuild();
</script>
